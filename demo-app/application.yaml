apiVersion: apps.example.org/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: demo-apps
  annotations:
    # Per-XR overrides for the diagnosis agent's fix PR. The actual fix
    # target is THIS FILE, not a static Rollout manifest — Crossplane
    # renders the real Rollout from spec.parameters below, so a "bad
    # deploy" fix means editing this XR's image tag/steps/etc, not a
    # separately-committed Rollout YAML.
    gitops.example.org/manifest-path: "demo-app/application.yaml"
    # Uncomment to point this specific app at a different repo than the
    # Composition-wide default:
    gitops.example.org/owner: "jfillman"
    gitops.example.org/repo: "idp"
    gitops.example.org/base-branch: "main"
spec:
  parameters:
    image:
      repository: ghcr.io/stefanprodan/podinfo
      tag: "6.7.0"
    replicas: 4
    port: 9898
    canary:
      steps:
        - setWeight: 20
          pauseSeconds: 30
        - setWeight: 50
          pauseSeconds: 30
        - setWeight: 80
          pauseSeconds: 30
      analysis:
        # Adjust to match your kube-prometheus-stack Service name/namespace
        # if it's not this default (check: kubectl get svc -n monitoring)
        prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
        interval: "15s"
        count: 5
