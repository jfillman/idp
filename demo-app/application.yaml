apiVersion: apps.example.org/v1alpha1
kind: Application
metadata:
  name: widget-api
  namespace: demo-apps
  annotations:
    # Per-XR overrides for the diagnosis agent's fix PR. The actual fix
    # target is THIS FILE, not a static Rollout manifest — Crossplane
    # renders the real Rollout from spec.parameters below, so a "bad
    # deploy" fix means editing this XR's image tag/steps/etc, not a
    # separately-committed Rollout YAML.
    gitops.example.org/manifest-path: "demo-app/application.yaml"
    # Uncomment to point this specific app at a different repo than the
    # Composition-wide default:
    gitops.example.org/owner: "jfillman"
    gitops.example.org/repo: "idp"
    gitops.example.org/base-branch: "main"
    #
    # SOURCE CODE location (for the source-bug scenario's fix PR).
    # Unset src.example.org/owner + src.example.org/repo default to the
    # same repo as gitops.example.org above (monorepo) — set path so the
    # agent has a hint where to look:
    src.example.org/path: "widget-api/app.py"
    # Uncomment if the app's source actually lives in a different repo
    # than the GitOps manifests (polyrepo):
    src.example.org/owner: "jfillman"
    src.example.org/repo: "idp"
    src.example.org/base-branch: "main"
spec:
  parameters:
    image:
      repository: localhost/widget-api
      tag: "1.0.1-buggy"
    replicas: 4
    port: 8080
    config:
      maxItemsPerOrder: "100"
      discountRate: "0.1"
      featureBulkDiscount: "true"
    canary:
      steps:
        - setWeight: 20
          pauseSeconds: 30
        - setWeight: 50
          pauseSeconds: 30
        - setWeight: 80
          pauseSeconds: 30
      analysis:
        prometheusAddress: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
        interval: "15s"
        count: 5
