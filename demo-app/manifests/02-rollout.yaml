apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  namespace: demo-apps
spec:
  replicas: 4
  revisionHistoryLimit: 3
  # If the new ReplicaSet isn't healthy within this window, Argo Rollouts
  # marks the Rollout Degraded and aborts even without failing an
  # AnalysisRun (covers ImagePullBackOff / CrashLoopBackOff cases).
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          # Explicitly pin the entrypoint to the image's documented default
          # (stefanprodan/podinfo Dockerfile: ENTRYPOINT ["./podinfo"]).
          # Declaring it here -- instead of leaving `command` unset -- means
          # the next GitOps reconcile/apply of this manifest will always
          # overwrite any out-of-band `command` edit made directly against
          # the live Rollout object. That is exactly how this incident's
          # bad `command: ["/podinfo", "--this-flag-does-not-exist"]` was
          # able to reach the live object without ever appearing in this
          # file or in `kubectl.kubernetes.io/last-applied-configuration`.
          command: ["./podinfo"]
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  strategy:
    # "Basic" canary (no traffic-routing plugin like nginx/istio/smi installed
    # on this kind cluster): a single Service selects both stable and canary
    # pods, so traffic splits approximately follow the replica ratio at each
    # step rather than being precisely weighted at the request level.
    canary:
      analysis:
        templates:
          - templateName: canary-no-restarts
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
        startingStep: 1
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 80
        - pause:
            duration: 30s
