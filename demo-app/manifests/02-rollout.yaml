apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  namespace: demo-apps
spec:
  replicas: 4
  revisionHistoryLimit: 3
  # If the new ReplicaSet isn't healthy within this window, Argo Rollouts
  # marks the Rollout Degraded and aborts even without failing an
  # AnalysisRun (covers ImagePullBackOff / CrashLoopBackOff cases).
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          # Pinned explicitly so that GitOps reconciliation always
          # reasserts the correct entrypoint. An out-of-band edit on
          # 2026-07-28 overrode this to an invalid path + flag
          # ("/podinfo --this-flag-does-not-exist"), crash-looping every
          # canary pod. Declaring the field here (instead of leaving it
          # unset) means the next apply/reconcile will overwrite any
          # future direct edit of this field rather than leaving it in
          # place.
          command:
            - ./podinfo
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
  strategy:
    # "Basic" canary (no traffic-routing plugin like nginx/istio/smi installed
    # on this kind cluster): a single Service selects both stable and canary
    # pods, so traffic splits approximately follow the replica ratio at each
    # step rather than being precisely weighted at the request level.
    canary:
      analysis:
        templates:
          - templateName: canary-no-restarts
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
        startingStep: 1
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 80
        - pause:
            duration: 30s
