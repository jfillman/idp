apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-no-restarts
  namespace: demo-apps
spec:
  args:
    # Injected automatically by Argo Rollouts when referenced from the
    # Rollout's background analysis with valueFrom.podTemplateHashValue
    - name: canary-hash
  metrics:
    - name: canary-restart-count
      interval: 15s
      count: 5
      failureLimit: 1
      provider:
        prometheus:
          # Adjust to match your kube-prometheus-stack Service name/namespace
          address: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
          query: |
            sum(
              kube_pod_container_status_restarts_total{
                namespace="demo-apps",
                pod=~".*{{args.canary-hash}}.*"
              }
            ) or on() vector(0)
      successCondition: "result[0] < 1"
    - name: canary-not-crashlooping
      interval: 15s
      count: 5
      failureLimit: 1
      provider:
        prometheus:
          address: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
          query: |
            sum(
              kube_pod_container_status_waiting_reason{
                namespace="demo-apps",
                reason="CrashLoopBackOff",
                pod=~".*{{args.canary-hash}}.*"
              }
            ) or on() vector(0)
      successCondition: "result[0] < 1"
